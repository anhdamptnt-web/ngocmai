<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nguyễn Thị Ngọc Mai</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;

      /* ===== DÒNG BẠN CÓ THỂ THAY ẢNH NỀN ===== */
      background:
      linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      url("background.jpg") center/cover no-repeat fixed;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    /* MAIN CARD GLASS EFFECT */
    .main-card {
      width: 100%;
      max-width: 1100px;
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.85);
      border-radius: 26px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.4);
      padding: 40px;
    }

    /* HEADER */
    .header {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 2px solid rgba(0,0,0,0.08);
      padding-bottom: 22px;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #4f8cff;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      transition: 0.4s ease;
    }

    .avatar:hover{
      transform: scale(1.05);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info h1 {
      font-size: 32px;
      color: #1a2b4c;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info p {
      color: #3c4b66;
      font-size: 15px;
      margin-top: 4px;
    }

    /* GRID CÂN ĐỐI */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .box {
      background: rgba(255,255,255,0.92);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      transition: 0.25s ease;
      min-height: 220px;
    }

    .box:hover {
      transform: translateY(-4px);
    }

    .box h2 {
      font-size: 18px;
      margin-bottom: 14px;
      color: #2c4ea3;
    }

    .box p, .box li {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
    }

    ul {
      padding-left: 18px;
    }

    /* PET GRID */
    .pets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 15px;
    }

    .pet-card {
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      transition: 0.35s ease;
    }

    .pet-card:hover{
      transform: scale(1.03);
    }

    .pet-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .music iframe{
      margin-top: 12px;
    }

    /* RESPONSIVE */
    @media(max-width: 768px){
      .grid{
        grid-template-columns: 1fr;
      }

      .pets{
        grid-template-columns: 1fr;
      }

      .header{
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="main-card">

    <!-- HEADER -->
    <div class="header">
      <div class="avatar">
        <img src="images/mai.jpg" alt="avatar">
      </div>

      <div class="info">
        <h1>Nguyễn Thị Ngọc Mai</h1>
        <p>25/09/2008 • Thiên Bình</p>
        <p>Màu yêu thích: Trắng • Xanh dương</p>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="grid">

      <div class="box">
        <h2>Sở thích</h2>
        <ul>
          <li>Chơi game</li>
          <li>Nghe nhạc</li>
          <li>Yêu động vật</li>
        </ul>
      </div>

      <div class="box">
        <h2>Bài hát yêu thích</h2>
        <div class="music">
          <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6ulLa3bIKLZ652YINbKH71" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

          <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/6lsKF7KXLuCeKGluqpZoI6" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </div>

      <!-- PET SECTION FULL WIDTH -->
      <div class="box" style="grid-column: 1/-1;">
        <h2>Thú cưng</h2>
        <div class="pets">
          <div class="pet-card">
            <img src="images/pet1.jpg" alt="Pet 1">
          </div>
          <div class="pet-card">
            <img src="images/pet2.jpg" alt="Pet 2">
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
