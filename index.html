<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nguyễn Thị Ngọc Mai</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('background.jpg') center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .main-card {
      width: 100%;
      max-width: 1100px;
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      padding: 40px;
    }

    .header {
      display: flex;
      gap: 25px;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(0,0,0,0.08);
      padding-bottom: 20px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #4f8cff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info h1 {
      font-size: 30px;
      color: #1a2b4c;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .info p {
      color: #3c4b66;
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .box {
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      transition: 0.3s;
    }

    .box:hover {
      transform: translateY(-5px);
    }

    .box h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #2c4ea3;
    }

    .box p, .box li {
      font-size: 15px;
      color: #333;
      line-height: 1.6;
    }

    ul {
      padding-left: 18px;
    }

    .pets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-top: 15px;
    }

    .pet-card {
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      background: white;
    }

    .pet-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .music {
      margin-top: 10px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    @media(max-width: 600px){
      .header{
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="main-card">

    <div class="header">
      <div class="avatar">
        <img src="images/mai.jpg" alt="avatar">
      </div>

      <div class="info">
        <h1>Nguyễn Thị Ngọc Mai</h1>
        <p>25/09/2008 • Thiên Bình</p>
        <p>Màu yêu thích: Trắng • Xanh dương</p>
      </div>
    </div>

    <div class="grid">

      <div class="box">
        <h2>Sở thích</h2>
        <ul>
          <li>Chơi game</li>
          <li>Nghe nhạc</li>
          <li>Yêu động vật</li>
        </ul>
      </div>

      <div class="box">
        <h2>Bài hát yêu thích</h2>
        <div class="music">
          <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6ulLa3bIKLZ652YINbKH71?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6lsKF7KXLuCeKGluqpZoI6?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </div>

      <div class="box" style="grid-column: 1/-1;">
        <h2>Thú cưng</h2>
        <div class="pets">
          <div class="pet-card">
            <img src="images/pet1.jpg" alt="Pet 1">
          </div>
          <div class="pet-card">
            <img src="images/pet2.jpg" alt="Pet 2">
          </div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
