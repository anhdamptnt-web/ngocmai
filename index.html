<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nguyễn Thị Ngọc Mai</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", Arial, sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;

/* ===== BACKGROUND IMAGE (CHANGE FILE NAME HERE) ===== */
background: url("background.jpg") center/cover no-repeat fixed;
}

/* LIGHT OVERLAY FOR READABILITY */
body::before{
content:"";
position:fixed;
inset:0;
background:rgba(255,255,255,0.25);
backdrop-filter:blur(2px);
z-index:-1;
}

/* MAIN CARD */
.container{
width:90%;
max-width:560px;
background:rgba(255,255,255,0.75);
backdrop-filter:blur(18px);
border-radius:24px;
padding:40px 36px;
border:1px solid rgba(255,255,255,0.6);
box-shadow:0 25px 60px rgba(0,0,0,0.25);
text-align:center;
color:#1e293b;
}

/* AVATAR FRAME */
.avatar-frame{
width:140px;
height:140px;
margin:0 auto 22px;
padding:4px;
border-radius:50%;
background:linear-gradient(135deg,#ffffff,#93c5fd);
}

.avatar{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
background:#e5e7eb;
}

/* NAME */
.name{
font-size:30px;
font-weight:700;
letter-spacing:0.4px;
margin-bottom:6px;
color:#1d4ed8;
}

.sub-info{
font-size:15px;
margin-bottom:20px;
color:#334155;
}

/* INFO BOX */
.info-box{
background:rgba(255,255,255,0.85);
border-radius:16px;
padding:18px 16px;
line-height:1.7;
font-size:16.5px;
margin-bottom:22px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.info-item{
margin:6px 0;
}

/* DIVIDER */
.line{
width:100%;
height:1px;
background:rgba(30,41,59,0.15);
margin:22px 0;
}

/* MUSIC TITLE */
.music-title{
font-size:17px;
margin-bottom:14px;
font-weight:600;
color:#1e3a8a;
}

iframe{
width:100%;
height:152px;
border:none;
border-radius:14px;
margin-bottom:12px;
}

/* MOBILE */
@media(max-width:520px){
.container{
padding:32px 24px;
}
.avatar-frame{
width:120px;
height:120px;
}
.name{
font-size:24px;
}
}
</style>
</head>

<body>

<div class="container">

<!-- AVATAR -->
<div class="avatar-frame">
<img src="images/ngocmai.jpg" class="avatar" alt="Ngọc Mai Avatar">
</div>

<div class="name">Nguyễn Thị Ngọc Mai</div>
<div class="sub-info">25 / 09 / 2008 • Thiên Bình</div>

<!-- INFO -->
<div class="info-box">
<div class="info-item">🎮 Game</div>
<div class="info-item">🎵 Nghe nhạc</div>
<div class="info-item">🐾 Yêu động vật</div>
<div class="info-item">🎨 Màu yêu thích: Trắng • Xanh dương</div>
</div>

<div class="line"></div>

<!-- MUSIC -->
<div class="music-title">Bài hát yêu thích</div>

<!-- ===== SPOTIFY MUSIC ===== -->
<iframe src="https://open.spotify.com/embed/track/6ulLa3bIKLZ652YINbKH71" loading="lazy"></iframe>
<iframe src="https://open.spotify.com/embed/track/6lsKF7KXLuCeKGluqpZoI6" loading="lazy"></iframe>

</div>

</body>
</html>


  </div>

</body>
</html>
